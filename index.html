<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Disney Dreamlight Valley Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --background: #f5f3fa;
    --surface: #ffffff;
    --primary: #514078;
    --primary-dark: #3d2f5c;
    --accent: #e5bd5a;
    --text: #2c2638;
    --muted: #766f83;
    --border: #e8e4ef;
    --danger: #b84c5c;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--background);
    color: var(--text);
}

header {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    padding: 28px 24px 24px;
}

.header-content {
    max-width: 1250px;
    margin: auto;
}

.title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
}

.title-row h1 {
    margin: 0;
    font-size: 28px;
}

.subtitle {
    margin: 6px 0 0;
    color: rgba(255,255,255,0.75);
    font-size: 14px;
}

.add-button {
    background: var(--accent);
    color: #2d2340;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.navigation {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.nav-button {
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.10);
    color: white;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 14px;
}

.nav-button:hover,
.nav-button.active {
    background: white;
    color: var(--primary);
}

main {
    max-width: 1500px;
    margin: 0 auto;
    padding: 28px 20px 60px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 28px;
    flex-wrap: wrap;
}

.search-box {
    flex: 1;
    min-width: 240px;
    padding: 13px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    font-size: 15px;
    outline: none;
}

.expand-buttons {
    display: flex;
    gap: 8px;
}

.small-button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--primary);
    border-radius: 8px;
    padding: 10px 13px;
    cursor: pointer;
}

.category {
    margin-bottom: 24px;
}

.category-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
}

.category-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.category-icon {
    font-size: 24px;
}

.category-header h2 {
    margin: 0;
    font-size: 19px;
}

.category-count {
    color: var(--muted);
    font-size: 14px;
    margin-left: 8px;
    font-weight: normal;
}

.category-arrow {
    color: var(--muted);
    font-size: 18px;
}

.character-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 16px;
}

.character-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(45,35,64,0.08);
}

.character-image {
    display: block;
    width: 100%;
    height: 230px;
    object-fit: cover;
    background: #eeeaf4;
}

.character-info {
    padding: 16px;
}

.character-name {
    margin: 0 0 4px;
    font-size: 19px;
}

.character-movie {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 14px;
}

.level-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.level-badge {
    background: #f0eaf8;
    color: var(--primary);
    border-radius: 20px;
    padding: 7px 12px;
    font-weight: bold;
    font-size: 14px;
}

.card-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}

.card-action {
    flex: 1;
    border: none;
    border-radius: 7px;
    padding: 8px;
    cursor: pointer;
    font-size: 13px;
}

.edit-button {
    background: #eef2f8;
    color: #405a78;
}

.delete-button {
    background: #faeeee;
    color: var(--danger);
}

.compact-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
    align-items: start;
}

.compact-category {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(45,35,64,0.08);
    min-width: 0;
}

.compact-category-header {
    padding: 14px 10px;
    background: #f0ebf7;
    color: var(--primary);
    font-weight: bold;
    font-size: 15px;
    border-bottom: 1px solid var(--border);
    text-align: center;
}

.compact-character-list {
    padding: 6px;
}

.compact-character {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 3px;
    border-bottom: 1px solid #f0edf4;
    min-width: 0;
}

.compact-character:last-child {
    border-bottom: none;
}

.compact-character-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    cursor: pointer;
}

.compact-character-name:hover {
    color: var(--primary);
}

.compact-level {
    flex-shrink: 0;
    width: 24px;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    color: var(--primary);
}

.level-button {
    flex-shrink: 0;
    width: 21px;
    height: 21px;
    padding: 0;
    border: none;
    border-radius: 5px;
    background: #eeeaf5;
    color: var(--primary);
    font-size: 15px;
    line-height: 21px;
    cursor: pointer;
    font-weight: bold;
}

.level-button:hover {
    background: #ddd5e9;
}

.level-button:active {
    transform: scale(0.92);
}

.compact-empty {
    padding: 12px 6px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
}

.alphabetical-list {
    display: grid;
    gap: 10px;
}

.alphabetical-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
}

.alphabetical-item img {
    width: 72px;
    height: 72px;
    object-fit: cover;
    border-radius: 9px;
}

.alphabetical-info {
    flex: 1;
}

.alphabetical-info h3 {
    margin: 0 0 6px;
}

.alphabetical-meta {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

.empty-state {
    text-align: center;
    background: var(--surface);
    border: 1px dashed #d8d0e5;
    border-radius: 16px;
    padding: 60px 24px;
}

.empty-icon {
    font-size: 52px;
    margin-bottom: 10px;
}

.empty-state h2 {
    margin: 0 0 8px;
}

.empty-state p {
    color: var(--muted);
    margin: 0 auto 22px;
    max-width: 430px;
}

.modal {
    display: none;
    position: fixed;
    z-index: 10;
    inset: 0;
    background: rgba(30,24,42,0.6);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.modal-content {
    background: var(--surface);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 26px;
}

.modal-content h2 {
    margin: 0 0 22px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: bold;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d8d2e1;
    border-radius: 8px;
    font-size: 15px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
}

.modal-button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    cursor: pointer;
}

.cancel-button {
    background: #eeeef1;
}

.save-button {
    background: var(--primary);
    color: white;
}

.database-search {
    width: 100%;
    padding: 13px 16px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
}

.database-list {
    max-height: 420px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
}

.database-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
}

.database-item:last-child {
    border-bottom: none;
}

.database-item:hover {
    background: #f5f2fa;
}

.database-item-image {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 8px;
    background: #eeeaf4;
}

.database-item-info {
    flex: 1;
}

.database-item-name {
    font-weight: bold;
}

.database-item-meta {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
}

.selected-character {
    display: flex;
    gap: 16px;
    align-items: center;
    background: #f5f2fa;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 20px;
}

.selected-character img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
}

.selected-character h3 {
    margin: 0 0 6px;
}

.selected-character p {
    margin: 3px 0;
    color: var(--muted);
    font-size: 14px;
}

.hidden {
    display: none !important;
}

.loading {
    text-align: center;
    padding: 50px;
    color: var(--muted);
}

.error-message {
    background: #faeeee;
    border: 1px solid #e8caca;
    color: var(--danger);
    border-radius: 12px;
    padding: 20px;
    line-height: 1.6;
}

@media (max-width: 1000px) {

    .compact-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

}

@media (max-width: 700px) {

    .compact-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

}

@media (max-width: 500px) {

    header {
        padding: 22px 16px;
    }

    .title-row {
        align-items: flex-start;
        flex-direction: column;
    }

    .title-row h1 {
        font-size: 23px;
    }

    .add-button {
        width: 100%;
    }

    main {
        padding: 20px 14px 40px;
    }

    .expand-buttons {
        width: 100%;
    }

    .small-button {
        flex: 1;
    }

    .compact-grid {
        grid-template-columns: 1fr;
    }

    .character-grid {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<header>

<div class="header-content">

<div class="title-row">

<div>

<h1>🏰 Disney Dreamlight Valley Tracker</h1>

<p class="subtitle">
Houd jullie Disney Dreamlight Valley-karakters bij
</p>

</div>

<button
class="add-button"
onclick="openAddModal()"
>
＋ Karakter toevoegen
</button>

</div>

<div class="navigation">

<button
id="categoryViewButton"
class="nav-button"
onclick="setView('categories')"
>
🗂️ Kaarten
</button>

<button
id="compactViewButton"
class="nav-button active"
onclick="setView('compact')"
>
📋 Compact overzicht
</button>

<button
id="alphabeticalViewButton"
class="nav-button"
onclick="setView('alphabetical')"
>
🔤 Alfabetisch
</button>

</div>

</div>

</header>

<main>

<div class="toolbar">

<input
id="searchInput"
class="search-box"
type="text"
placeholder="🔍 Zoek in jullie tracker..."
oninput="render()"
>

<div
id="expandButtons"
class="expand-buttons"
>

<button
class="small-button"
onclick="expandAll()"
>
▼ Alles open
</button>

<button
class="small-button"
onclick="collapseAll()"
>
▲ Alles dicht
</button>

</div>

</div>

<div id="app"></div>

</main>

<div
id="characterModal"
class="modal"
>

<div class="modal-content">

<h2 id="modalTitle">
Karakter toevoegen
</h2>

<div id="databaseSelector">

<input
id="databaseSearch"
class="database-search"
type="text"
placeholder="🔍 Zoek een karakter..."
oninput="renderDatabaseList()"
>

<div
id="databaseList"
class="database-list"
></div>

</div>

<div
id="selectedCharacter"
class="selected-character hidden"
>

<img
id="selectedCharacterImage"
src=""
alt=""
>

<div>

<h3 id="selectedCharacterName"></h3>

<p id="selectedCharacterMovie"></p>

<p id="selectedCharacterCollection"></p>

</div>

</div>

<form
id="characterForm"
class="hidden"
>

<div class="form-group">

<label for="specialty">
Specialiteit
</label>

<select
id="specialty"
required
>

<option value="">
Kies een specialiteit
</option>

<option value="Gardening">
🌱 Gardening
</option>

<option value="Mining">
⛏️ Mining
</option>

<option value="Foraging">
🌿 Foraging
</option>

<option value="Fishing">
🎣 Fishing
</option>

<option value="Digging">
🪓 Digging
</option>

</select>

</div>

<div class="form-group">

<label for="level">
Friendship level
</label>

<input
type="number"
id="level"
min="1"
max="10"
value="1"
required
>

</div>

<div class="modal-actions">

<button
type="button"
class="modal-button cancel-button"
onclick="closeModal()"
>
Annuleren
</button>

<button
type="submit"
class="modal-button save-button"
>
Opslaan
</button>

</div>

</form>

</div>

</div>

            .select("*")
            .order("added_at", {

        `;

        return;

    }

    trackerData = data.map(character => ({

        characterId: character.character_id,

        specialty: character.specialty,

        level: character.level,

        addedAt: character.added_at

    }));

    render();

}


/* =====================================================
   KARAKTERS
===================================================== */

function getTrackedCharacters() {

    return trackerData

        .map(trackerCharacter => {

            const databaseCharacter =
                characterDatabase.find(character =>
                    character.id === trackerCharacter.characterId
                );

            if (!databaseCharacter) {
                return null;
            }

            return {

                ...databaseCharacter,

                specialty:
                    trackerCharacter.specialty,

                level:
                    trackerCharacter.level,

                addedAt:
                    trackerCharacter.addedAt

            };

        })

        .filter(character => character !== null);

}


function getFilteredCharacters() {

    const searchTerm =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    return getTrackedCharacters()

        .filter(character =>

            character.name
                .toLowerCase()
                .includes(searchTerm)

            ||

            character.movie
                .toLowerCase()
                .includes(searchTerm)

            ||

            character.specialty
                .toLowerCase()
                .includes(searchTerm)

        );

}


function sortCharactersInCategory(characters) {

    return characters.sort((a, b) =>

        (a.addedAt || 0) -
        (b.addedAt || 0)

    );

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    const app =
        document.getElementById("app");

    const characters =
        getFilteredCharacters();

    updateNavigation();

    document
        .getElementById("expandButtons")
        .style.display =
            currentView === "categories"
                ? "flex"
                : "none";

    if (characters.length === 0) {

        app.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    🏰
                </div>

                <h2>
                    Jullie tracker is nog leeg
                </h2>

                <p>
                    Voeg een karakter toe uit de Dreamlight Valley-database.
                </p>

                <button
                    class="add-button"
                    onclick="openAddModal()"
                >
                    ＋ Karakter toevoegen
                </button>

            </div>

        `;

        return;

    }

    if (currentView === "categories") {

        renderCategories(characters);

    }

    else if (currentView === "compact") {

        renderCompact(characters);

    }

    else {

        renderAlphabetical(characters);

    }

}


/* =====================================================
   NAVIGATIE
===================================================== */

function updateNavigation() {

    document
        .getElementById("categoryViewButton")
        .classList.toggle(
            "active",
            currentView === "categories"
        );

    document
        .getElementById("compactViewButton")
        .classList.toggle(
            "active",
            currentView === "compact"
        );

    document
        .getElementById("alphabeticalViewButton")
        .classList.toggle(
            "active",
            currentView === "alphabetical"
        );

}


function setView(view) {

    currentView = view;

    render();

}


/* =====================================================
   COMPACT OVERZICHT
===================================================== */

function renderCompact(characters) {

    const app =
        document.getElementById("app");

    app.innerHTML = `
        <div class="compact-grid"></div>
    `;

    const grid =
        app.querySelector(".compact-grid");

    categories.forEach(category => {

        const categoryCharacters =
            sortCharactersInCategory(

                characters.filter(character =>
                    character.specialty === category
                )

            );

        const section =
            document.createElement("section");

        section.className =
            "compact-category";

        section.innerHTML = `

            <div class="compact-category-header">

                ${categoryIcons[category]}

                ${category}

                <span
                    style="
                        float: right;
                        font-weight: normal;
                    "
                >
                    ${categoryCharacters.length}
                </span>

            </div>

            <div class="compact-character-list"></div>

        `;

        const list =
            section.querySelector(
                ".compact-character-list"
            );

        if (categoryCharacters.length === 0) {

            list.innerHTML = `

                <div class="compact-empty">
                    Geen karakters
                </div>

            `;

        }

        categoryCharacters.forEach(character => {

            const row =
                document.createElement("div");

            row.className =
                "compact-character";

            row.innerHTML = `

                <button
                    class="level-button"
                    title="Friendship level verlagen"
                    onclick="
                        changeLevel(
                            '${character.id}',
                            -1
                        )
                    "
                >
                    −
                </button>

                <span class="compact-level">
                    ${character.level}
                </span>

                <button
                    class="level-button"
                    title="Friendship level verhogen"
                    onclick="
                        changeLevel(
                            '${character.id}',
                            1
                        )
                    "
                >
                    +
                </button>

                <span
                    class="compact-character-name"
                    title="${character.name} - klik om te bewerken"
                    onclick="
                        editCharacter(
                            '${character.id}'
                        )
                    "
                >
                    ${character.name}
                </span>

            `;

            list.appendChild(row);

        });

        grid.appendChild(section);

    });

}


/* =====================================================
   LEVEL ONLINE AANPASSEN
===================================================== */

async function changeLevel(characterId, amount) {

    const character =
        trackerData.find(item =>
            item.characterId === characterId
        );

    if (!character) {
        return;
    }

    const newLevel =
        Number(character.level) + amount;

    if (newLevel < 1 || newLevel > 10) {
        return;
    }

    const { error } =
        await supabaseClient

            .from("characters")

            .update({
                level: newLevel
            })

            .eq(
                "character_id",
                characterId
            );

    if (error) {

        alert(
            "Het level kon niet worden opgeslagen: " +
            error.message
        );

        return;

    }

    character.level =
        newLevel;

    render();

}


/* =====================================================
   CATEGORIEKAARTEN
===================================================== */

function renderCategories(characters) {

    const app =
        document.getElementById("app");

    app.innerHTML = "";

    categories.forEach(category => {

        const categoryCharacters =
            sortCharactersInCategory(

                characters.filter(character =>
                    character.specialty === category
                )

            );

        if (categoryCharacters.length === 0) {
            return;
        }

        const section =
            document.createElement("section");

        section.className =
            "category";

        section.innerHTML = `

            <div
                class="category-header"
                onclick="
                    toggleCategory(
                        '${category}'
                    )
                "
            >

                <div class="category-title">

                    <span class="category-icon">
                        ${categoryIcons[category]}
                    </span>

                    <h2>

                        ${category}

                        <span class="category-count">

                            ${categoryCharacters.length}

                        </span>

                    </h2>

                </div>

                <span class="category-arrow">

                    ${
                        expandedCategories[category]
                            ? "▼"
                            : "▶"
                    }

                </span>

            </div>

            <div
                class="
                    character-grid
                    ${
                        expandedCategories[category]
                            ? ""
                            : "hidden"
                    }
                "
            ></div>

        `;

        const grid =
            section.querySelector(
                ".character-grid"
            );

        categoryCharacters.forEach(character => {

            grid.appendChild(
                createCharacterCard(character)
            );

        });

        app.appendChild(section);

    });

}


/* =====================================================
   KARAKTERKAART
===================================================== */

function createCharacterCard(character) {

    const card =
        document.createElement("div");

    card.className =
        "character-card";

    card.innerHTML = `

        <img
            class="character-image"
            src="${getCharacterImage(character)}"
            alt="${character.name}"
            onerror="
                this.onerror=null;
                this.src='${createPlaceholder(character.name)}'
            "
        >

        <div class="character-info">

            <h3 class="character-name">
                ${character.name}
            </h3>

            <p class="character-movie">
                🎬 ${character.movie}
            </p>

            <div class="level-row">

                <span class="level-badge">
                    Level ${character.level}
                </span>

            </div>

            <div class="card-actions">

                <button
                    class="card-action edit-button"
                    onclick="
                        editCharacter(
                            '${character.id}'
                        )
                    "
                >
                    Bewerken
                </button>

                <button
                    class="card-action delete-button"
                    onclick="
                        deleteCharacter(
                            '${character.id}'
                        )
                    "
                >
                    Verwijderen
                </button>

            </div>

        </div>

    `;

    return card;

}


/* =====================================================
   ALFABETISCH
===================================================== */

function renderAlphabetical(characters) {

    const app =
        document.getElementById("app");

    const sortedCharacters =
        [...characters].sort((a, b) =>
            a.name.localeCompare(b.name)
        );

    app.innerHTML = `
        <div class="alphabetical-list"></div>
    `;

    const list =
        app.querySelector(
            ".alphabetical-list"
        );

    sortedCharacters.forEach(character => {

        const item =
            document.createElement("div");

        item.className =
            "alphabetical-item";

        item.innerHTML = `

            <img
                src="${getCharacterImage(character)}"
                alt="${character.name}"
                onerror="
                    this.onerror=null;
                    this.src='${createPlaceholder(character.name)}'
                "
            >

            <div class="alphabetical-info">

                <h3>
                    ${character.name}
                </h3>

                <div class="alphabetical-meta">

                    Level ${character.level}

                    <br>

                    ${
                        categoryIcons[
                            character.specialty
                        ]
                    }

                    ${character.specialty}

                    · 🎬 ${character.movie}

                </div>

            </div>

            <button
                class="card-action edit-button"
                onclick="
                    editCharacter(
                        '${character.id}'
                    )
                "
            >
                Bewerken
            </button>

        `;

        list.appendChild(item);

    });

}


/* =====================================================
   OPEN / DICHT
===================================================== */

function toggleCategory(category) {

    expandedCategories[category] =
        !expandedCategories[category];

    render();

}


function expandAll() {

    categories.forEach(category => {

        expandedCategories[category] =
            true;

    });

    render();

}


function collapseAll() {

    categories.forEach(category => {

        expandedCategories[category] =
            false;

    });

    render();

}


/* =====================================================
   TOEVOEGEN
===================================================== */

function openAddModal() {

    editingId = null;

    selectedDatabaseCharacter = null;

    document
        .getElementById("modalTitle")
        .textContent =
            "Karakter toevoegen";

    document
        .getElementById("characterModal")
        .style.display =
            "flex";

    document
        .getElementById("databaseSelector")
        .classList.remove("hidden");

    document
        .getElementById("selectedCharacter")
        .classList.add("hidden");

    document
        .getElementById("characterForm")
        .classList.add("hidden");

    document
        .getElementById("databaseSearch")
        .value = "";

    renderDatabaseList();

}


function renderDatabaseList() {

    const searchTerm =
        document
            .getElementById("databaseSearch")
            .value
            .toLowerCase()
            .trim();

    const existingIds =
        trackerData.map(character =>
            character.characterId
        );

    const availableCharacters =

        characterDatabase

            .filter(character =>
                !existingIds.includes(
                    character.id
                )
            )

            .filter(character =>

                character.name
                    .toLowerCase()
                    .includes(searchTerm)

                ||

                character.movie
                    .toLowerCase()
                    .includes(searchTerm)

                ||

                character.collection
                    .toLowerCase()
                    .includes(searchTerm)

            )

            .sort((a, b) =>
                a.name.localeCompare(b.name)
            );

    const list =
        document.getElementById(
            "databaseList"
        );

    list.innerHTML = "";

    availableCharacters.forEach(character => {

        const item =
            document.createElement("div");

        item.className =
            "database-item";

        item.innerHTML = `

            <img
                class="database-item-image"
                src="${getCharacterImage(character)}"
                alt="${character.name}"
                onerror="
                    this.onerror=null;
                    this.src='${createPlaceholder(character.name)}'
                "
            >

            <div class="database-item-info">

                <div class="database-item-name">

                    ${character.name}

                </div>

                <div class="database-item-meta">

                    🎬 ${character.movie}

                    ·

                    📍 ${character.collection}

                </div>

            </div>

        `;

        item.onclick =
            () =>
                selectDatabaseCharacter(
                    character
                );

        list.appendChild(item);

    });

}


function selectDatabaseCharacter(character) {

    selectedDatabaseCharacter =
        character;

    document
        .getElementById("databaseSelector")
        .classList.add("hidden");

    document
        .getElementById("selectedCharacter")
        .classList.remove("hidden");

    const image =
        document.getElementById(
            "selectedCharacterImage"
        );

    image.src =
        getCharacterImage(character);

    image.onerror = function() {

        this.onerror = null;

        this.src =
            createPlaceholder(
                character.name
            );

    };

    document
        .getElementById("selectedCharacterName")
        .textContent =
            character.name;

    document
        .getElementById("selectedCharacterMovie")
        .textContent =
            "🎬 " + character.movie;

    document
        .getElementById("selectedCharacterCollection")
        .textContent =
            "📍 " + character.collection;

    document
        .getElementById("characterForm")
        .classList.remove("hidden");

}


/* =====================================================
   BEWERKEN
===================================================== */

function editCharacter(id) {

    const trackerCharacter =
        trackerData.find(character =>
            character.characterId === id
        );

    const databaseCharacter =
        characterDatabase.find(character =>
            character.id === id
        );

    if (!trackerCharacter || !databaseCharacter) {
        return;
    }

    editingId =
        id;

    selectedDatabaseCharacter =
        databaseCharacter;

    document
        .getElementById("modalTitle")
        .textContent =
            "Karakter bewerken";

    document
        .getElementById("characterModal")
        .style.display =
            "flex";

    document
        .getElementById("databaseSelector")
        .classList.add("hidden");

    document
        .getElementById("selectedCharacter")
        .classList.remove("hidden");

    const image =
        document.getElementById(
            "selectedCharacterImage"
        );

    image.src =
        getCharacterImage(
            databaseCharacter
        );

    image.onerror = function() {

        this.onerror = null;

        this.src =
            createPlaceholder(
                databaseCharacter.name
            );

    };

    document
        .getElementById("selectedCharacterName")
        .textContent =
            databaseCharacter.name;

    document
        .getElementById("selectedCharacterMovie")
        .textContent =
            "🎬 " +
            databaseCharacter.movie;

    document
        .getElementById("selectedCharacterCollection")
        .textContent =
            "📍 " +
            databaseCharacter.collection;

    document
        .getElementById("characterForm")
        .classList.remove("hidden");

    document
        .getElementById("specialty")
        .value =
            trackerCharacter.specialty;

    document
        .getElementById("level")
        .value =
            trackerCharacter.level;

}


/* =====================================================
   FORMULIER
===================================================== */

document
    .getElementById("characterForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const specialty =
                document
                    .getElementById("specialty")
                    .value;

            const level =
                Number(
                    document
                        .getElementById("level")
                        .value
                );

            if (editingId) {

                const { error } =
                    await supabaseClient

                        .from("characters")

                        .update({

                            specialty:
                                specialty,

                            level:
                                level

                        })

                        .eq(
                            "character_id",
                            editingId
                        );

                if (error) {

                    alert(
                        "Het karakter kon niet worden opgeslagen: " +
                        error.message
                    );

                    return;

                }

                const character =
                    trackerData.find(item =>
                        item.characterId ===
                        editingId
                    );

                character.specialty =
                    specialty;

                character.level =
                    level;

            }

            else {

                if (!selectedDatabaseCharacter) {

                    alert(
                        "Selecteer eerst een karakter."
                    );

                    return;

                }

                const newCharacter = {

                    character_id:
                        selectedDatabaseCharacter.id,

                    specialty:
                        specialty,

                    level:
                        level,

                    added_at:
                        Date.now()

                };

                const { data, error } =
                    await supabaseClient

                        .from("characters")

                        .insert(
                            newCharacter
                        )

                        .select()
                        .single();

                if (error) {

                    alert(
                        "Het karakter kon niet worden toegevoegd: " +
                        error.message
                    );

                    return;

                }

                trackerData.push({

                    characterId:
                        data.character_id,

                    specialty:
                        data.specialty,

                    level:
                        data.level,

                    addedAt:
                        data.added_at

                });

            }

            closeModal();

            render();

        }

    );


/* =====================================================
   VERWIJDEREN
===================================================== */

async function deleteCharacter(id) {

    const character =
        getTrackedCharacters().find(character =>
            character.id === id
        );

    if (!character) {
        return;
    }

    if (!confirm(

        "Weet je zeker dat je " +
        character.name +
        " wilt verwijderen?"

    )) {

        return;

    }

    const { error } =
        await supabaseClient

            .from("characters")

            .delete()

            .eq(
                "character_id",
                id
            );

    if (error) {

        alert(
            "Het karakter kon niet worden verwijderd: " +
            error.message
        );

        return;

    }

    trackerData =
        trackerData.filter(character =>
            character.characterId !== id
        );

    render();

}


/* =====================================================
   MODAL
===================================================== */

function closeModal() {

    document
        .getElementById("characterModal")
        .style.display =
            "none";

    selectedDatabaseCharacter =
        null;

}


window.onclick =
    function(event) {

        const modal =
            document.getElementById(
                "characterModal"
            );

        if (event.target === modal) {

            closeModal();

        }

    };


/* =====================================================
   AFBEELDINGEN
===================================================== */

function getCharacterImage(character) {

    return (

        "https://dreamlightvalleywiki.com/" +

        "Special:FilePath/" +

        encodeURIComponent(
            character.name
        ) +

        ".png"

    );

}


function createPlaceholder(name) {

    return (

        "https://placehold.co/400x400?text=" +

        encodeURIComponent(
            name
        )

    );

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadTracker();

    }
);

</script>
